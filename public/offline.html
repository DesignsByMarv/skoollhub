<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>You’re offline · SkoollHub</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #172033; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 24px; background: white; text-align: center; box-shadow: 0 16px 48px #0f172a12; }
      .mark { display: grid; width: 64px; height: 64px; margin: 0 auto 20px; place-items: center; border-radius: 18px; background: #4f46e5; color: white; font-size: 34px; font-weight: 800; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: #64748b; }
      button { margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 20px; background: #4f46e5; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to open your campus feed and messages.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
